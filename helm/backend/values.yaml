# Default values for backend chart
# This chart deploys the demo-backend application to Kubernetes

namespace: demo

replicaCount: 2

image:
  # Replace <ECR_REPO_URL> with the actual ECR repository URL from Terraform output
  # Example: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/demo-backend
  repository: <ECR_REPO_URL>/demo-backend
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  name: http

# Environment variables
env:
  - name: PORT
    value: "8080"

# Resources configuration
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Readiness probe configuration
readinessProbe:
  path: /api/health
  initialDelaySeconds: 5
  periodSeconds: 10
  successThreshold: 1

# Liveness probe configuration
livenessProbe:
  path: /api/health
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 3

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Pod labels
podLabels: {}

# Service labels
serviceLabels: {}

# Deployment annotations
deploymentAnnotations: {}

# Service annotations
serviceAnnotations: {}
